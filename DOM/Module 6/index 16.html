<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .draggable{
            padding: 8px;;
            margin: 4px;
            background-color: #fff;
            border: 1px solid black;
            cursor: move;

        }
        .dragging{
            opacity: 0.5;
        }



    </style>
</head>
<body>
    <p>Laurence Svekis Courses</p>
    <ul>
        <li class="draggable" draggable="true">Item 1</li>
        <li class="draggable" draggable="true">Item 2</li>
        <li class="draggable" draggable="true">Item 3</li>
        <li class="draggable" draggable="true">Item 4</li>
    </ul>
    <script src="app_drag_drop.js"></script>
</body>
</html>
