<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h2>Job Application</h2>
        <label for="name1">Name</label>
        <input type="text" id="name1">
        <br>
        <br>
         <label for="email1">Email</label>
        <input type="email" id="email1">
        <br>
        <br>
         <label for="phone1">Phone</label>
        <input type="tel" id="phone1">
        <br>
        <br>
        <label for="fileupload">Resume:</label>
        <input type="file" name="fileupload" id="fileupload">
        <br>
        <br>
        <label for="experience">experience(in years)</label>
        <input type="number" name="experience" id="experience" min="0" max="50">
        <br>
        <br>
        <fieldset>
            <legend>Skills</legend>
              <label for="checkbox1">HTML</label>
            <input type="checkbox" id="checkbox1">
            <label for="checkbox2">CSS</label>
            <input type="checkbox" name="checkbox2" id="checkbox2">
            <label for="checkbox3">JAVASCRIPT</label>
            <input type="checkbox" name="checkbox3" id="checkbox3">
        </fieldset>
        <br>
        <br>
        <label for="educationtype">Highest Education</label>
        <select name="educationtype" id="educationtype">
            <option value="a">High School</option>
               <option value="b">Graduation</option>
        </select>
        <fieldset>
            <legend>Availability</legend>
            <label for="radio1">Full-time</label>
            <input type="radio" name="radio1" id="radio1">
            <br>
            <label for="radio1">Part-time</label>
            <input type="radio" name="radio1" id="radio1">
        </fieldset>
        <br>
        <br>
        <label for="comments1">Additional comments</label>
        <br>
        <textarea name="comment1" id="comment1" rows="10" cols="80"></textarea>
        <br>
        <input type="submit" value="Submit Application" id="button1">
    
    </form>

</body>
</html>
