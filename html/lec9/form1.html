<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <h1>Event Registration</h1>
        <label for="name">Enter name</label>
        <input type="text" id="name" name="name">
        <br>
        <br>
        <label for="email">Enter email</label>
        <input type="email" id="email" name="email">
        <br>
        <br>
        <label for="phone">Enter phone number</label>
        <input type="tel" id="phone" name="phone">
        <br>
        <br>
        <label for="occupationtype">Occupation</label>
        <select name="occupationtype" id="occupationtype">
            <option value="student">Student</option>
            <option value="proffesional">Professional</option>
            <option value="other">others</option>
        </select>
        <fieldset>
            <legend>Topics of interest</legend>
            <label for="checkbox1">HTML</label>
            <input type="checkbox" id="checkbox1">
            <label for="checkbox2">CSS</label>
            <input type="checkbox" name="checkbox2" id="checkbox2">
            <label for="checkbox3">JAVASCRIPT</label>
            <input type="checkbox" name="checkbox3" id="checkbox3">
        </fieldset>
        <br>
        <br>
        <label for="comment1">Comments</label>
        <br>
        <textarea name="comment1" id="comment1"></textarea>
        <br>
        <br>
       
        <input type="submit" id="button1" value="Register">

    </form>
</body>
</html>
